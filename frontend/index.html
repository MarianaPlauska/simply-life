    <title>Simply-Life OS</title>

    <!-- limpa service workers e caches antigos do backend fastapi -->
    <script>
      (function(){
        if('serviceWorker' in navigator){
          // se existe um SW cacheando rotas /auth/* do backend antigo, limpa
          caches.keys().then(function(names){
            names.forEach(function(name){
              if(name.indexOf('api-cache')>-1 || name.indexOf('runtime')>-1){
                caches.delete(name);
              }
            });
          });
        }
      })();
    </script>
