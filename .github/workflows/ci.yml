name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-1234567890
      FERNET_KEY: tBCpoHjUPHuKfAMwYmKJxbi8bC96D4JFJatJNI3crkE=
      DATABASE_URL: sqlite:///./test_ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx bandit

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v

      - name: Security scan (bandit)
        run: |
          cd backend
          bandit -r . -x ./tests,./.venv,./alembic -ll -f txt || true

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run tests
        run: |
          cd frontend
          npx vitest run

      - name: Security audit (npm)
        run: |
          cd frontend
          npm audit --audit-level=high || true

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      JWT_SECRET: ci-test-secret-do-not-use-in-production-1234567890
      FERNET_KEY: tBCpoHjUPHuKfAMwYmKJxbi8bC96D4JFJatJNI3crkE=
      DATABASE_URL: sqlite:///./test_ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend -t simply-life-backend .

      - name: Build frontend image
        run: docker build --target frontend -t simply-life-frontend .
