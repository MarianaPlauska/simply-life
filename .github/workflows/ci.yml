name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      # variáveis necessárias para o backend inicializar sem .env
      JWT_SECRET: ci-test-secret-do-not-use-in-production-1234567890
      FERNET_KEY: tT3BlbkFJ0Ek5GfL7d4j5z8k9m2n4p6r8t0v2x4z6A8C=
      # usa sqlite no ci — não precisa de postgres instalado
      DATABASE_URL: sqlite:///./test_ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instala dependências de teste (sem psycopg2)
        run: |
          cd backend
          pip install -r requirements-test.txt

      - name: roda os testes
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: instala dependências
        run: |
          cd frontend
          npm ci

      - name: type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: roda os testes
        run: |
          cd frontend
          npx vitest run

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: verifica o dockerfile existe
        run: test -f Dockerfile || echo "Dockerfile não encontrado — pulando build"

      - name: build backend image
        run: |
          if [ -f Dockerfile ]; then
            docker build --target backend -t simply-life-backend . || true
          fi

      - name: build frontend image
        run: |
          if [ -f Dockerfile ]; then
            docker build --target frontend -t simply-life-frontend . || true
          fi
