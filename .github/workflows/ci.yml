name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://zuxkqmooxvnulgllduhr.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Unit tests with coverage
        run: |
          cd frontend
          npx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e "const fs=require('fs'); const p='frontend/coverage/coverage-summary.json'; if(!fs.existsSync(p)) { console.log('sem coverage-summary'); process.exit(0);} const t=JSON.parse(fs.readFileSync(p,'utf8')).total; const pct=t.lines.pct; console.log('Coverage linhas: '+pct+'%');"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: frontend-checks
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_SUPABASE_URL: https://zuxkqmooxvnulgllduhr.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        if: env.E2E_EMAIL != ''
        run: npx playwright test

      - name: Skip Playwright (sem secrets)
        if: env.E2E_EMAIL == ''
        run: echo "E2E_EMAIL não configurado — Playwright ignorado neste job."
