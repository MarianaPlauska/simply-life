name: Supabase Keep-Alive

on:
  schedule:
    # Roda a cada 4 dias às 08:00 UTC (05:00 BRT)
    - cron: '0 8 */4 * *'
  workflow_dispatch: # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase para evitar pause por inatividade
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}")
          echo "Supabase respondeu com HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase está online!"
          else
            echo "⚠️ Supabase retornou status $STATUS"
            exit 1
          fi
