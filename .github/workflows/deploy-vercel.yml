# Deploy de produção na Vercel (GitHub Actions).
# Secrets: VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID
name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para Vercel
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAW_ORG: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          trim()
          {
            printf '%s' "$1" | tr -d '\r\n\t "'
          }

          VERCEL_TOKEN=$(trim "${RAW_TOKEN:-}")
          VERCEL_ORG_ID=$(trim "${RAW_ORG:-}")
          VERCEL_PROJECT_ID=$(trim "${RAW_PROJECT:-}")

          echo "=== Diagnóstico (sem expor valores) ==="
          echo "VERCEL_TOKEN: ${#VERCEL_TOKEN} caracteres"
          echo "VERCEL_ORG_ID: ${#VERCEL_ORG_ID} caracteres (esperado: team_...)"
          echo "VERCEL_PROJECT_ID: ${#VERCEL_PROJECT_ID} caracteres (esperado: prj_...)"
          if [ -n "$VERCEL_ORG_ID" ]; then echo "ORG prefix: ${VERCEL_ORG_ID%%_*}_"; fi
          if [ -n "$VERCEL_PROJECT_ID" ]; then echo "PROJECT prefix: ${VERCEL_PROJECT_ID%%_*}_"; fi
          echo "======================================"

          # Método 1 — CLI (build remoto na Vercel; usa env vars do painel)
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            case "$VERCEL_ORG_ID" in team_*) ;;
              *)
                echo "::error::VERCEL_ORG_ID deve começar com team_ (Team ID, não Project ID)."
                exit 1
                ;;
            esac
            case "$VERCEL_PROJECT_ID" in prj_*) ;;
              *)
                echo "::error::VERCEL_PROJECT_ID deve começar com prj_"
                exit 1
                ;;
            esac

            echo "Deploy via Vercel CLI (build remoto)..."
            npm install --global vercel@latest
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            export VERCEL_ORG_ID
            export VERCEL_PROJECT_ID
            vercel deploy --prod --yes --token="$VERCEL_TOKEN"
            exit 0
          fi

          # Método 2 — Deploy Hook (só se token não estiver completo)
          if [ -n "${HOOK:-}" ]; then
            HOOK=$(trim "$HOOK")
            echo "Deploy Hook: ${#HOOK} caracteres"
            HTTP_CODE=$(curl -sS -o /tmp/vercel-hook-response.json -w "%{http_code}" -X POST "$HOOK")
            echo "Resposta Vercel (HTTP $HTTP_CODE):"
            cat /tmp/vercel-hook-response.json || true
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              exit 0
            fi
            echo "::error::Deploy Hook falhou (HTTP $HTTP_CODE). Configure os 3 secrets do token."
            exit 1
          fi

          echo "::error::Faltam secrets: VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID"
          exit 1
