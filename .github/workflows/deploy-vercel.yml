# Dispara build de produção na Vercel a cada push na main.
# Requer secret VERCEL_DEPLOY_HOOK no GitHub (docs/DEPLOY_VERCEL.md).
name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$HOOK" ]; then
            echo "Deploy Hook encontrado (${#HOOK} caracteres). Disparando build na Vercel..."
            RESPONSE=$(curl -fsS -w "\n%{http_code}" -X POST "$HOOK")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Resposta Vercel (HTTP $HTTP_CODE): $BODY"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deploy Hook aceito. Aguarde 1–3 min no painel da Vercel."
              exit 0
            fi
            echo "::error::Deploy Hook retornou HTTP $HTTP_CODE"
            exit 1
          fi

          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Deploy via Vercel CLI..."
            npm install --global vercel@latest
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            exit 0
          fi

          echo "::error::SECRET NÃO CONFIGURADO NO GITHUB."
          echo ""
          echo "Você criou o Hook na Vercel (passo 1), mas falta o passo 2:"
          echo "  GitHub → simply-life → Settings → Secrets and variables → Actions"
          echo "  New repository secret → Nome: VERCEL_DEPLOY_HOOK → Valor: URL do hook"
          echo ""
          echo "Depois: Actions → Deploy Vercel → Run workflow"
          exit 1
