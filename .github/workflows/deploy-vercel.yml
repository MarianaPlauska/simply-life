# Deploy de produção na Vercel (GitHub Actions).
# Secrets: VERCEL_TOKEN + VERCEL_PROJECT_ID (+ VERCEL_ORG_ID opcional; auto-detecta se errado)
name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para Vercel
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAW_ORG: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          trim()
          {
            printf '%s' "$1" | tr -d '\r\n\t "'
          }

          VERCEL_TOKEN=$(trim "${RAW_TOKEN:-}")
          VERCEL_ORG_ID=$(trim "${RAW_ORG:-}")
          VERCEL_PROJECT_ID=$(trim "${RAW_PROJECT:-}")

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Configure VERCEL_TOKEN e VERCEL_PROJECT_ID nos secrets do GitHub."
            exit 1
          fi

          case "$VERCEL_PROJECT_ID" in prj_*) ;;
            *)
              echo "::error::VERCEL_PROJECT_ID deve começar com prj_"
              exit 1
              ;;
          esac

          echo "=== Diagnóstico ==="
          echo "TOKEN: ${#VERCEL_TOKEN} chars | PROJECT: ${#VERCEL_PROJECT_ID} chars | ORG informado: ${#VERCEL_ORG_ID} chars"
          echo "==================="

          project_status()
          {
            local team_id="${1:-}"
            local url="https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}"
            if [ -n "$team_id" ]; then
              url="${url}?teamId=${team_id}"
            fi
            curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "$url"
          }

          RESOLVED_ORG=""
          TEAM_SLUG=""

          if [ -n "$VERCEL_ORG_ID" ]; then
            code=$(project_status "$VERCEL_ORG_ID")
            if [ "$code" = "200" ]; then
              RESOLVED_ORG="$VERCEL_ORG_ID"
              echo "Projeto OK com VERCEL_ORG_ID informado."
            else
              echo "::warning::VERCEL_ORG_ID não bate com o projeto (HTTP $code). Buscando time correto..."
            fi
          fi

          if [ -z "$RESOLVED_ORG" ]; then
            code=$(project_status "")
            if [ "$code" = "200" ]; then
              echo "Projeto encontrado na conta pessoal (sem teamId)."
            else
              TEAMS_JSON=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v2/teams")
              TEAM_IDS=$(printf '%s' "$TEAMS_JSON" | grep -o '"id":"team_[^"]*"' | cut -d'"' -f4 || true)
              for team in $TEAM_IDS; do
                code=$(project_status "$team")
                if [ "$code" = "200" ]; then
                  RESOLVED_ORG="$team"
                  TEAM_SLUG=$(printf '%s' "$TEAMS_JSON" | grep -A2 "\"id\":\"${team}\"" | grep -o '"slug":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
                  echo "Projeto encontrado no time ${team} (slug: ${TEAM_SLUG:-desconhecido})."
                  echo "::warning::Atualize VERCEL_ORG_ID no GitHub para: ${team}"
                  break
                fi
              done
            fi
          fi

          if [ -z "$RESOLVED_ORG" ] && [ "$(project_status "")" != "200" ]; then
            echo "::error::Projeto não encontrado com este token."
            echo "1. VERCEL_PROJECT_ID = prj_... do simply-life → Settings → General"
            echo "2. Recrie VERCEL_TOKEN em vercel.com/account/tokens com scope **Full Account**"
            echo "3. VERCEL_ORG_ID = Team ID do time que aparece na URL: vercel.com/SEU-TIME/simply-life"
            exit 1
          fi

          echo "Deploy via Vercel CLI..."
          npm install --global vercel@latest
          mkdir -p .vercel

          if [ -n "$RESOLVED_ORG" ]; then
            printf '{"orgId":"%s","projectId":"%s"}' "$RESOLVED_ORG" "$VERCEL_PROJECT_ID" > .vercel/project.json
            export VERCEL_ORG_ID="$RESOLVED_ORG"
          else
            printf '{"projectId":"%s"}' "$VERCEL_PROJECT_ID" > .vercel/project.json
          fi

          export VERCEL_PROJECT_ID

          DEPLOY_ARGS=(deploy --prod --yes --token="$VERCEL_TOKEN")
          if [ -n "$TEAM_SLUG" ]; then
            DEPLOY_ARGS+=(--scope "$TEAM_SLUG")
          fi

          vercel "${DEPLOY_ARGS[@]}"
