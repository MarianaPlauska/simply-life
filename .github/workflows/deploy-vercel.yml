# Deploy de produção na Vercel (GitHub Actions).
# Conta Hobby: só precisa VERCEL_TOKEN + VERCEL_PROJECT_ID (sem Team ID).
name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para Vercel
        env:
          RAW_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RAW_ORG: ${{ secrets.VERCEL_ORG_ID }}
          RAW_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          trim()
          {
            printf '%s' "$1" | tr -d '\r\n\t "'
          }

          VERCEL_TOKEN=$(trim "${RAW_TOKEN:-}")
          VERCEL_ORG_ID=$(trim "${RAW_ORG:-}")
          VERCEL_PROJECT_ID=$(trim "${RAW_PROJECT:-}")

          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Configure VERCEL_TOKEN e VERCEL_PROJECT_ID no GitHub."
            exit 1
          fi

          case "$VERCEL_PROJECT_ID" in prj_*) ;;
            *)
              echo "::error::VERCEL_PROJECT_ID deve começar com prj_ (Settings → General do simply-life)."
              exit 1
              ;;
          esac

          echo "=== Diagnóstico ==="
          echo "TOKEN: ${#VERCEL_TOKEN} chars"
          echo "PROJECT: ${#VERCEL_PROJECT_ID} chars"
          echo "ORG (opcional): ${#VERCEL_ORG_ID} chars"
          echo "==================="

          curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v2/teams" > /tmp/vercel-teams.json

          echo "Times/contas acessíveis com este token:"
          node -e "
            const data = require('/tmp/vercel-teams.json');
            const teams = data.teams || [];
            if (!teams.length) {
              console.log('  (nenhum — token sem scope ou inválido)');
            }
            for (const t of teams) {
              console.log('  - ' + t.slug + ' → ' + t.id);
            }
          "

          node -e "
            const fs = require('fs');
            const token = process.env.VERCEL_TOKEN;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const orgHint = process.env.VERCEL_ORG_ID || '';
            const teams = (JSON.parse(fs.readFileSync('/tmp/vercel-teams.json', 'utf8')).teams) || [];

            async function check(teamId) {
              const q = teamId ? '?teamId=' + teamId : '';
              const res = await fetch('https://api.vercel.com/v9/projects/' + projectId + q, {
                headers: { Authorization: 'Bearer ' + token },
              });
              return res.status;
            }

            (async () => {
              let orgId = '';
              let slug = '';

              if (orgHint) {
                const st = await check(orgHint);
                if (st === 200) {
                  orgId = orgHint;
                  const hit = teams.find((t) => t.id === orgHint);
                  slug = hit?.slug || '';
                  console.log('Projeto OK com VERCEL_ORG_ID informado.');
                } else {
                  console.log('::warning::VERCEL_ORG_ID ignorado (HTTP ' + st + '). Auto-detectando...');
                }
              }

              if (!orgId) {
                for (const t of teams) {
                  const st = await check(t.id);
                  if (st === 200) {
                    orgId = t.id;
                    slug = t.slug;
                    console.log('Projeto encontrado na conta/time: ' + t.slug + ' (' + t.id + ')');
                    break;
                  }
                }
              }

              if (!orgId) {
                const personal = await check('');
                if (personal === 200) {
                  console.log('Projeto encontrado sem teamId (conta pessoal).');
                } else {
                  console.log('::error::Projeto não encontrado.');
                  console.log('1. VERCEL_PROJECT_ID = Project ID do simply-life (prj_...)');
                  console.log('2. Recrie VERCEL_TOKEN com scope Full Account');
                  console.log('3. Conta Hobby: pode APAGAR o secret VERCEL_ORG_ID');
                  process.exit(1);
                }
              }

              fs.mkdirSync('.vercel', { recursive: true });
              const link = orgId
                ? { orgId, projectId }
                : { projectId };
              fs.writeFileSync('.vercel/project.json', JSON.stringify(link));
              fs.writeFileSync('/tmp/vercel-deploy-meta.json', JSON.stringify({ orgId, slug }));
            })();
          " VERCEL_TOKEN="$VERCEL_TOKEN" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" VERCEL_ORG_ID="$VERCEL_ORG_ID"

          TEAM_SLUG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/vercel-deploy-meta.json')).slug || '')")
          RESOLVED_ORG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/vercel-deploy-meta.json')).orgId || '')")

          echo "Deploy via Vercel CLI..."
          npm install --global vercel@latest

          if [ -n "$RESOLVED_ORG" ]; then
            export VERCEL_ORG_ID="$RESOLVED_ORG"
          fi
          export VERCEL_PROJECT_ID

          DEPLOY_ARGS=(deploy --prod --yes --token="$VERCEL_TOKEN")
          if [ -n "$TEAM_SLUG" ]; then
            DEPLOY_ARGS+=(--scope "$TEAM_SLUG")
          fi

          vercel "${DEPLOY_ARGS[@]}"
