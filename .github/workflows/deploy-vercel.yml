# Deploy de produção na Vercel (GitHub Actions).
# Método recomendado: secrets VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID
# Alternativa: VERCEL_DEPLOY_HOOK (URL completa do painel Vercel)
name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy para Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Método 1 — CLI com token (recomendado; não depende de webhook)
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Deploy via Vercel CLI (token)..."
            npm install --global vercel@latest
            export VERCEL_ORG_ID
            export VERCEL_PROJECT_ID
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            exit 0
          fi

          # Método 2 — Deploy Hook
          if [ -n "${HOOK:-}" ]; then
            HOOK=$(printf '%s' "$HOOK" | tr -d '\r\n\t "')
            echo "Deploy Hook: ${#HOOK} caracteres"

            case "$HOOK" in
              https://api.vercel.com/v1/integrations/deploy/*/*) ;;
              *)
                echo "::error::URL do hook inválida ou incompleta."
                echo "Deve ser: https://api.vercel.com/v1/integrations/deploy/SEU_PROJECT_ID/SEU_TOKEN"
                echo "Use o botão Copy na Vercel (não selecione texto manualmente)."
                echo "Ou configure VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID (veja docs/DEPLOY_VERCEL.md)."
                exit 1
                ;;
            esac

            echo "Disparando build na Vercel..."
            HTTP_CODE=$(curl -sS -o /tmp/vercel-hook-response.json -w "%{http_code}" -X POST "$HOOK")
            echo "Resposta Vercel (HTTP $HTTP_CODE):"
            cat /tmp/vercel-hook-response.json || true
            echo ""

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Deploy Hook aceito. Aguarde 1–3 min no painel da Vercel."
              exit 0
            fi

            if [ "$HTTP_CODE" = "404" ]; then
              echo "::error::Hook retornou 404 — URL errada ou hook apagado."
              echo "1. Vercel → simply-life → Settings → Git → Deploy Hooks"
              echo "2. Apague o hook antigo → Create Hook (branch main)"
              echo "3. Botão Copy na URL → atualize o secret VERCEL_DEPLOY_HOOK no GitHub"
              echo "Ou use o método com token (mais confiável) em docs/DEPLOY_VERCEL.md"
            else
              echo "::error::Deploy Hook retornou HTTP $HTTP_CODE"
            fi
            exit 1
          fi

          echo "::error::Nenhum método de deploy configurado."
          echo ""
          echo "Configure no GitHub (Settings → Secrets → Actions):"
          echo "  RECOMENDADO: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
          echo "  OU: VERCEL_DEPLOY_HOOK (URL completa do Deploy Hook)"
          echo ""
          echo "Guia: docs/DEPLOY_VERCEL.md"
          exit 1
